spring.application.name=room-allocation-system

# Database Configuration (H2 In-Memory Database for instant setup)
spring.datasource.url=jdbc:h2:mem:room_allocation_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console to view database at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Port
server.port=8080

# Allow larger PDF/Excel uploads for the import feature
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Include the error message in JSON error responses
server.error.include-message=always
